<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Lytescape — Coming Soon</title>
<link rel="icon" type="image/png" href="favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --ease: cubic-bezier(0.45, 0, 0.15, 1);
    --warm: #f2c88a;

    /* switch geometry — overridden per breakpoint */
    --switch-w: 72px;
    --switch-h: 34px;
    --switch-pad: 3px;
    --knob: 26px;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    height: 100%;
    background: #06050a;
    overflow: hidden;
  }

  body {
    font-family: 'Poppins', sans-serif;
    color: #f4efe6;
  }

  .stage {
    position: relative;
    width: 100vw;
    height: 100vh;
    height: 100dvh;
    min-height: 100dvh;
    overflow: hidden;
  }

  /* ---------- Background photography ---------- */
  .bg {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: 50% 55%;
  }

  .bg-off {
    z-index: 1;
    filter: saturate(0.94);
  }

  .bg-on {
    z-index: 2;
    opacity: 0;
    transition: opacity 3000ms var(--ease);
  }

  .stage.is-on .bg-on {
    opacity: 1;
  }

  .scrim {
    position: absolute;
    inset: 0;
    z-index: 3;
    background: radial-gradient(ellipse at 50% 42%, rgba(0,0,0,0.10) 0%, rgba(0,0,0,0.50) 68%, rgba(0,0,0,0.70) 100%);
    transition: opacity 3000ms var(--ease);
  }

  .stage.is-on .scrim {
    opacity: 0.55;
  }

  /* ---------- Top bar ---------- */
  .topbar {
    position: absolute;
    top: 0; left: 0; right: 0;
    z-index: 5;
    display: flex;
    justify-content: flex-end;
    align-items: center;
    padding: max(28px, env(safe-area-inset-top)) clamp(20px, 4vw, 56px) 0 0;
    padding-right: clamp(20px, 4vw, 56px);
  }
  .logo {
  position: absolute;
  top: 28px;
  left: 28px;
  width: 120px;
  height: auto;
  z-index: 10;
}

  .tag {
    font-size: 11px;
    font-weight: 400;
    letter-spacing: 0.32em;
    color: rgba(244, 239, 230, 0.55);
  }

  /* ---------- Center content ---------- */
  .center {
    position: absolute;
    inset: 0;
    z-index: 5;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 20px clamp(20px, 5vw, 40px);
  }

  .heading-wrap {
    position: relative;
    width: 100%;
    max-width: min(94vw, 520px);
    height: 170px;
  }

  .heading {
    font-weight: 600;
    font-size: 30px;
    line-height: 1.22;
    letter-spacing: -0.01em;
    color: #faf7f1;
    position: absolute;
    top: 50%;
    left: 0; right: 0;
    transform: translateY(-50%);
    opacity: 0;
    pointer-events: none;
    transition: opacity 700ms var(--ease) 900ms;
  }

  .heading.state-off {
    opacity: 1;
    pointer-events: auto;
  }

  .stage.is-on .heading.state-off {
    opacity: 0;
    pointer-events: none;
  }

  .stage.is-on .heading.state-on {
    opacity: 1;
    pointer-events: auto;
  }

  /* ---------- Switch ---------- */
  .switch-row {
    display: flex;
    align-items: center;
    gap: 16px;
    margin-top: 48px;
  }

  .switch-label {
    font-size: 11px;
    font-weight: 400;
    letter-spacing: 0.26em;
    color: rgba(244, 239, 230, 0.42);
    transition: color 400ms var(--ease), opacity 400ms var(--ease);
    user-select: none;
  }

  .switch-label.off { color: rgba(244, 239, 230, 0.72); }
  .switch-label.on { color: rgba(244, 239, 230, 0.34); }

  .stage.is-on .switch-label.off { color: rgba(244, 239, 230, 0.30); }
  .stage.is-on .switch-label.on { color: rgba(250, 240, 220, 0.92); }

  .switch {
    position: relative;
    width: var(--switch-w);
    height: var(--switch-h);
    border-radius: 999px;
    border: 1px solid rgba(244, 239, 230, 0.28);
    background: rgba(20, 18, 24, 0.35);
    cursor: pointer;
    display: block;
    padding: 0;
    outline-offset: 4px;
    transition: border-color 400ms var(--ease), background 400ms var(--ease);
  }

  .switch:hover {
    border-color: rgba(244, 239, 230, 0.5);
  }

  .switch:focus-visible {
    outline: 1px solid rgba(244, 239, 230, 0.8);
  }

  .stage.is-on .switch {
    border-color: rgba(242, 200, 138, 0.55);
    background: rgba(50, 38, 20, 0.35);
  }

  .knob {
    position: absolute;
    top: var(--switch-pad);
    left: var(--switch-pad);
    width: var(--knob);
    height: var(--knob);
    border-radius: 50%;
    background: #d8d2c6;
    box-shadow: 0 0 0 rgba(242, 200, 138, 0);
    transition: transform 350ms var(--ease), background 500ms var(--ease), box-shadow 700ms var(--ease);
  }

  .stage.is-on .knob {
    transform: translateX(calc(var(--switch-w) - 2 * var(--switch-pad) - var(--knob)));
    background: #fff3da;
    box-shadow: 0 0 18px 4px rgba(242, 200, 138, 0.65), 0 0 40px 10px rgba(242, 200, 138, 0.25);
  }

  /* ---------- Below-switch swap: hint <-> ME Products CTA ---------- */
  .below-row {
    position: relative;
    width: 100%;
    max-width: 320px;
    margin-top: 20px;
    height: 92px;
  }

  .hint {
    position: absolute;
    top: 0; left: 0; right: 0;
    font-size: 11.5px;
    font-weight: 300;
    letter-spacing: 0.13em;
    color: rgba(244, 239, 230, 0.4);
    opacity: 1;
    pointer-events: auto;
    transition: opacity 500ms var(--ease);
  }

  .stage.is-on .hint {
    opacity: 0;
    pointer-events: none;
  }

  .cta-block {
    position: absolute;
    top: 0; left: 0; right: 0;
    opacity: 0;
    pointer-events: none;
    transition: opacity 550ms var(--ease) 1400ms;
  }

  .stage.is-on .cta-block {
    opacity: 1;
    pointer-events: auto;
  }

  .cta-prompt {
    font-size: 11.5px;
    font-weight: 300;
    letter-spacing: 0.13em;
    color: rgba(244, 239, 230, 0.45);
    margin-bottom: 14px;
  }

  .cta-button {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    height: 46px;
    padding: 0 24px;
    border-radius: 999px;
    background: #f4efe6;
    color: #14120f;
    font-family: 'Poppins', sans-serif;
    font-size: 13px;
    font-weight: 500;
    letter-spacing: 0.04em;
    text-decoration: none;
    border: none;
    cursor: pointer;
    transition: background 250ms var(--ease);
  }

  .cta-button:hover {
    background: #ffffff;
  }

  .cta-button:focus-visible {
    outline: 1px solid rgba(244, 239, 230, 0.9);
    outline-offset: 3px;
  }

  .cta-arrow {
    display: inline-block;
    transition: transform 250ms var(--ease);
  }

  .cta-button:hover .cta-arrow {
    transform: translate(2px, -2px);
  }

  @media (prefers-reduced-motion: reduce) {
    .bg-on, .scrim, .heading, .knob, .switch, .switch-label, .hint, .cta-block, .cta-arrow, .cta-button {
      transition-duration: 1ms !important;
    }
  }

  /* ================= MOBILE (default, < 768px) ================= */
  .stage {
    padding-bottom: env(safe-area-inset-bottom);
  }

  /* ================= TABLET, 768px – 1199px ================= */
  @media (min-width: 768px) {
    :root {
      --switch-w: 84px;
      --switch-h: 44px;
      --switch-pad: 4px;
      --knob: 36px;
    }

    .heading-wrap { max-width: min(92vw, 920px); height: 210px; }
    .heading { font-size: 46px; line-height: 1.2; }
    .switch-row { margin-top: 58px; gap: 20px; }
    .switch-label { font-size: 12px; letter-spacing: 0.28em; }
    .below-row { max-width: 420px; margin-top: 26px; }
    .cta-prompt { font-size: 12px; }
  }

  /* ================= DESKTOP, >= 1200px ================= */
  @media (min-width: 1200px) {
    :root {
      --switch-w: 72px;
      --switch-h: 34px;
      --switch-pad: 3px;
      --knob: 26px;
    }

    .heading-wrap { max-width: min(88vw, 1200px); height: 250px; }
    .heading { font-size: 60px; line-height: 1.18; white-space: nowrap; }
    .stay-tuned {
  font-size: 15px;
  font-weight: 400;
  display: inline-block;
  transform: translateY(1px);
}
.coming-text {
  font-size: 40px;
  font-weight: 900;
   transform: translateY(15px);
  
}
    .switch-row { margin-top: 64px; gap: 18px; transform: translateY(-25px); }
    .below-row { max-width: 460px; margin-top: 22px; }
  }

  @media (max-width: 767px) {
    .cta-button { padding: 0 22px; }
  }
</style>
</head>
